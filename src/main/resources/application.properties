# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/jobwork_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Data initialisation ? runs data.sql AFTER Hibernate creates tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# File uploads
app.upload.dir=./uploads/receipts
app.upload.receipts-dir=uploads/receipts

# Logging
logging.level.org.hibernate.SQL=DEBUG
